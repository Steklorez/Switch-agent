<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>The emuiibo overlay (illustration)</title>
  <!-- An illustration, not a screenshot: emuiibo's own overlay labels and
       layout (overlay/source/main.cpp, overlay/lang/en.json, 1.1.3), drawn
       the way Tesla draws an overlay over a game. -->
  <defs>
    <linearGradient id="game" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd3a8"/>
      <stop offset="0.55" stop-color="#5bb48a"/>
      <stop offset="1" stop-color="#2f7c6a"/>
    </linearGradient>
  </defs>
  <rect width="360" height="480" fill="url(#game)"/>
  <circle cx="300" cy="120" r="46" fill="#ffe69a" opacity="0.55"/>
  <path d="M0 400 Q90 350 180 392 T360 380 V480 H0 Z" fill="#2e6a54" opacity="0.7"/>

  <!-- the overlay panel, docked left as Tesla draws it -->
  <rect x="0" y="0" width="236" height="480" fill="#000" opacity="0.82"/>
  <text x="16" y="34" fill="#fff" font-size="21" font-weight="600">emuiibo</text>
  <text x="16" y="52" fill="#9aa2ad" font-size="10">emuiibo v1.1.3 (release)</text>
  <line x1="16" y1="64" x2="220" y2="64" stroke="#ffffff" stroke-opacity="0.25"/>

  <text x="16" y="86" fill="#9aa2ad" font-size="10">Current game is</text>
  <text x="95" y="86" fill="#35c46f" font-size="10" font-weight="600">intercepted</text>

  <rect x="12" y="96" width="212" height="30" rx="4" fill="#ffffff" fill-opacity="0.06"/>
  <text x="20" y="115" fill="#fff" font-size="11">Emulation status</text>
  <rect x="176" y="103" width="36" height="16" rx="8" fill="#35c46f"/>
  <circle cx="204" cy="111" r="6" fill="#fff"/>
  <text x="152" y="115" fill="#35c46f" font-size="10">on</text>

  <rect x="12" y="130" width="212" height="44" rx="4" fill="#ffffff" fill-opacity="0.06"/>
  <text x="20" y="147" fill="#9aa2ad" font-size="10">Active virtual amiibo</text>
  <text x="20" y="165" fill="#fff" font-size="12" font-weight="600">Isabelle</text>
  <text x="152" y="165" fill="#35c46f" font-size="10">connected</text>

  <rect x="12" y="178" width="212" height="30" rx="4" fill="#ffffff" fill-opacity="0.06"/>
  <text x="20" y="197" fill="#fff" font-size="11">Random UUID</text>
  <rect x="176" y="185" width="36" height="16" rx="8" fill="#4a4f57"/>
  <circle cx="184" cy="193" r="6" fill="#cfd4da"/>
  <text x="152" y="197" fill="#9aa2ad" font-size="10">off</text>

  <line x1="16" y1="222" x2="220" y2="222" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="16" y="242" fill="#9aa2ad" font-size="10">Available amiibos in 'Animal Crossing': 4</text>

  <g font-size="12" fill="#fff">
    <rect x="12" y="252" width="212" height="30" rx="4" fill="#27d7f6" fill-opacity="0.16" stroke="#27d7f6" stroke-width="1.5"/>
    <text x="22" y="271">Isabelle</text>
    <text x="206" y="271" fill="#ffd166" text-anchor="end">★</text>
    <text x="22" y="305">K.K. Slider</text>
    <text x="22" y="337">Tom Nook</text>
    <text x="22" y="369">Timmy &amp; Tommy</text>
    <line x1="22" y1="318" x2="214" y2="318" stroke="#ffffff" stroke-opacity="0.08"/>
    <line x1="22" y1="350" x2="214" y2="350" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>

  <line x1="16" y1="440" x2="220" y2="440" stroke="#ffffff" stroke-opacity="0.25"/>
  <g font-size="10" fill="#cfd4da">
    <circle cx="24" cy="458" r="7" fill="#fff" fill-opacity="0.9"/><text x="21" y="461.5" fill="#000" font-size="9" font-weight="700">A</text>
    <text x="36" y="462">Select</text>
    <circle cx="86" cy="458" r="7" fill="#fff" fill-opacity="0.9"/><text x="82.5" y="461.5" fill="#000" font-size="9" font-weight="700">B</text>
    <text x="98" y="462">Back</text>
    <text x="140" y="462">R3 Connect</text>
  </g>
</svg>
